x-coverage:
  state: covered
  reason: covered
  detail: >-
    Utrecht operates real, institution-owned machine surfaces and they were reached. Two are anonymously
    callable: the DSpace 9.0 REST API and OAI-PMH interface at dspace.library.uu.nl, and the SAML 2.0
    IdP metadata at login.uu.nl. One is live but authenticated: the Yoda API at portal.yoda.uu.nl/api,
    which 302s every call to /user/login — the 20 OpenAPIs in this repo describe it and are Utrecht's
    own authorship, not a vendor's. One surface is a tenancy: research-portal.uu.nl is Elsevier Pure and
    is recorded as such rather than credited to Utrecht. What does NOT exist was probed and confirmed
    absent: api.uu.nl, developer.uu.nl, developers.uu.nl, opendata.uu.nl and data.uu.nl all fail to resolve;
    there is no developer portal, no course-catalog or campus API, no published API terms, plans or rate
    limits. Two partial obstructions worth recording: public.yoda.uu.nl sits behind an Anubis bot challenge,
    and a subset of www.uu.nl content paths (/yoda, /en/research/*) serve a 'Security verifications' interstitial
    to non-browser clients while returning a proper 404 title for genuinely missing pages — those pages
    are live, just not machine-readable from here.
  evidence:
  - url: https://portal.yoda.uu.nl/api/schema_get_schemas
    status: 302
    note: redirect to /user/login — live, auth-gated
  - url: https://dspace.library.uu.nl/server/api
    status: 200
    note: DSpace 9.0 HAL/JSON root
  - url: https://dspace.library.uu.nl/server/api/discover/search/objects?query=climate
    status: 200
    note: anonymous query returns results
  - url: https://dspace.library.uu.nl/server/oai/request?verb=Identify
    status: 200
  - url: https://login.uu.nl/nidp/saml2/metadata
    status: 200
    note: signed SAML 2.0 metadata
  - url: https://metadata.surfconext.nl/idps-metadata.xml
    status: 200
    note: carries the uu.nl entityID
  - url: https://research-portal.uu.nl/ws/oai?verb=Identify
    status: 200
    note: Pure tenancy, open OAI
  - url: https://research-portal.uu.nl/ws/api/524/openapi.yaml
    status: 401
    note: Pure Web Service requires an API key
  - url: https://public.yoda.uu.nl/api/schema_get_schemas
    status: 200
    note: Anubis bot challenge body, not data
  - url: https://osiris.uu.nl/
