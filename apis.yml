apis:
- aid: utrecht:repository-oai
  name: Utrecht University Repository OAI-PMH
  description: >-
    OAI-PMH 2.0 metadata harvesting interface for the Utrecht University Library institutional repository.
    Verified live 2026-08-30 on DSpace 9.0: Identify, ListMetadataFormats and ListRecords all answer,
    earliest datestamp 2001-01-03, 16 metadata prefixes advertised including oai_dc, mods, mets, ore,
    rioxx and etdms. An OpenAIRE-profiled set is served separately at /oai/openaire.
  humanURL: https://www.uu.nl/en/university-library/utrecht-university-repository
  baseURL: https://dspace.library.uu.nl/server/oai/request
  tags:
  - Library
  - Repository
  - OAI-PMH
  - Metadata
  - Open Access
  - Research
  properties:
  - type: Documentation
    url: https://www.uu.nl/en/university-library/utrecht-university-repository
  - type: OpenAIRE
    url: https://dspace.library.uu.nl/oai/openaire?verb=Identify
  x-operator: institution
  x-operator-evidence: >-
    dspace.library.uu.nl is under Utrecht's own registrable domain and the Identify response names repositoryName
    'Utrecht University Repository' with adminEmail repository@uu.nl. DSpace is community open-source
    software, not a commercial tenancy — Utrecht hosts and operates the instance. The DSpace REST/OAI
    contract itself is DSpace's, so no generic DSpace OpenAPI is saved under this slug.
