aid: utrecht
name: Utrecht University
description: >-
  Utrecht University (Universiteit Utrecht) is a public research university in Utrecht, Netherlands, founded
  in 1636 and a member of the League of European Research Universities. It is one of the few universities
  in this catalog whose largest machine-readable surface is its OWN engineering rather than a vendor's:
  Utrecht authors and operates Yoda, a GPL-3.0 iRODS-based research data management platform (github.com/UtrechtUniversity/yoda-ruleset),
  and runs it in production at portal.yoda.uu.nl. The Yoda HTTP API is real but not open — every call
  redirects to SolisID login unless it carries a session cookie or a Yoda data access token — so the OpenAPIs
  in this repo describe a live institution-operated API that no anonymous client can call. Alongside it
  the University Library runs a DSpace 9.0 institutional repository whose REST API and OAI-PMH interface
  are both openly readable at dspace.library.uu.nl, and IT Services operates a SAML 2.0 identity provider
  registered in the SURFconext federation. The research information system is NOT Utrecht's: research-portal.uu.nl
  is an Elsevier Pure tenancy (uu.elsevierpure.com), recorded here as a tenant relationship and not as
  Utrecht's contract. There is no central developer portal, no api.uu.nl, no public course-catalog or
  campus API, and no published API terms or rate limits; OSIRIS, the student administration system, returns
  403 to unauthenticated clients.
