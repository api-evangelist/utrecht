openapi: 3.2.0
info:
  description: Yoda core ruleset containing iRODS and Python rules and policies useful for all Yoda environments.
  contact:
    email: l.r.westerhof@uu.nl
  version: 2.1.0
  title: Yoda core Revisions API
servers:
- url: https://portal.yoda.test/api
  description: Local Yoda development server
security:
- cookieAuth: []
- basicAuth: []
tags:
- name: Revisions
paths:
  /revisions_search_on_filename:
    post:
      tags:
      - Revisions
      summary: Search revisions of a file in a research folder and return list of…
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - searchString
              properties:
                searchString:
                  type: string
                  description: String to search for as part of a file name
                  default: null
                offset:
                  type: integer
                  description: Starting point in total resultset to start fetching
                  default: '0'
                limit:
                  type: integer
                  description: Max size of the resultset to be returned
                  default: '10'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_info:
                    type:
                    - string
                    - 'null'
                  data: {}
        '400':
          $ref: '#/components/responses/status_400'
        '500':
          $ref: '#/components/responses/status_500'
      operationId: postRevisionsSearchOnFilename
      x-operation-id-source: derived
  /revisions_list:
    post:
      tags:
      - Revisions
      summary: Get list revisions of a file in a research folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              properties:
                path:
                  type: string
                  description: Path to data object to find revisions for
                  default: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_info:
                    type:
                    - string
                    - 'null'
                  data: {}
        '400':
          $ref: '#/components/responses/status_400'
        '500':
          $ref: '#/components/responses/status_500'
      operationId: postRevisionsList
      x-operation-id-source: derived
  /revisions_restore:
    post:
      tags:
      - Revisions
      summary: Copy selected revision to target collection with given name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision_id
              - overwrite
              - coll_target
              - new_filename
              properties:
                revision_id:
                  type: string
                  description: Data id of the revision to be restored
                  default: null
                overwrite:
                  type: string
                  description: Overwrite indication from front end {restore_no_overwrite, restore_overwrite, restore_next_to}
                  default: null
                coll_target:
                  type: string
                  description: Target collection to place the file
                  default: null
                new_filename:
                  type: string
                  description: New file name as entered by user (in case of duplicate)
                  default: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_info:
                    type:
                    - string
                    - 'null'
                  data: {}
        '400':
          $ref: '#/components/responses/status_400'
        '500':
          $ref: '#/components/responses/status_500'
      operationId: postRevisionsRestore
      x-operation-id-source: derived
components:
  responses:
    status_400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/result_error'
    status_500:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/result_error'
  schemas:
    result_error:
      type: object
      properties:
        status:
          type: string
          description: Holds an error ID
        status_info:
          type: string
          description: Holds a human-readable error description
        data:
          description: empty
          type:
          - object
          - 'null'
  securitySchemes:
    cookieAuth:
      in: cookie
      type: apiKey
      name: yoda_session
    basicAuth:
      type: http
      scheme: basic
