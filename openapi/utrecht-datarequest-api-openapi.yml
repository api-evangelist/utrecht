openapi: 3.2.0
info:
  description: Yoda core ruleset containing iRODS and Python rules and policies useful for all Yoda environments.
  contact:
    email: l.r.westerhof@uu.nl
  version: 2.1.0
  title: Yoda Datarequest API
servers:
- url: https://portal.yoda.test/api
  description: Local Yoda development server
security:
- cookieAuth: []
- basicAuth: []
tags:
- name: datarequest
paths:
  /datarequest_action_permitted:
    post:
      tags:
      - datarequest
      summary: Wrapper around datarequest_action_permitted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              - roles
              - statuses
              properties:
                request_id:
                  type: string
                  description: Unique identifier of the data request
                  default: null
                roles:
                  type: array
                  description: 'List of permitted roles (possible values: PM, ED, DM, DAC, OWN, REV)'
                  default: null
                  items: {}
                statuses:
                  type: array
                  description: List of permitted current data request statuses or None (check skipped)
                  default: null
                  items: {}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_info:
                    type:
                    - string
                    - 'null'
                  data: {}
        '400':
          $ref: '#/components/responses/status_400'
        '500':
          $ref: '#/components/responses/status_500'
      operationId: postDatarequestActionPermitted
      x-operation-id-source: derived
  /datarequest_roles_get:
    post:
      tags:
      - datarequest
      summary: Get roles of invoking user. if this parameter is missing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id:
                  type:
                  - string
                  - 'null'
                  description: Unique identifier of the data request (OWN and REV roles will not be checked
                  default: None
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_info:
                    type:
                    - string
                    - 'null'
                  data: {}
        '400':
          $ref: '#/components/responses/status_400'
        '500':
          $ref: '#/components/responses/status_500'
      operationId: postDatarequestRolesGet
      x-operation-id-source: derived
  /datarequest_schema_get:
    post:
      tags:
      - datarequest
      summary: Create datarequest schema get
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - schema_name
              properties:
                schema_name:
                  type: string
                  description: (undocumented)
                  default: null
                version:
                  type: string
                  description: (undocumented)
                  default: SCHEMA_VERSION
      responses:
        '200':
