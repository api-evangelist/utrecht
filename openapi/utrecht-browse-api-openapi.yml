openapi: 3.2.0
info:
  description: Yoda core ruleset containing iRODS and Python rules and policies useful for all Yoda environments.
  contact:
    email: l.r.westerhof@uu.nl
  version: 2.1.0
  title: Yoda core Browse API
servers:
- url: https://portal.yoda.test/api
  description: Local Yoda development server
security:
- cookieAuth: []
- basicAuth: []
tags:
- name: Browse
paths:
  /browse_folder:
    post:
      tags:
      - Browse
      summary: Get paginated collection contents, including size/modify date information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                coll:
                  type: string
                  description: Collection to get paginated contents of
                  default: '''/'''
                sort_on:
                  type: string
                  description: Column to sort on ('name', 'modified' or size)
                  default: '''name'''
                sort_order:
                  type: string
                  description: Column sort order ('asc' or 'desc')
                  default: '''asc'''
                offset:
                  type: integer
                  description: Offset to start browsing from
                  default: '0'
                limit:
                  type: integer
                  description: Limit number of results
                  default: '10'
                space:
                  type: string
                  description: Space the collection is in
                  default: pathutil.Space.OTHER.value
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_info:
                    type:
                    - string
                    - 'null'
                  data: {}
        '400':
          $ref: '#/components/responses/status_400'
        '500':
          $ref: '#/components/responses/status_500'
      operationId: postBrowseFolder
      x-operation-id-source: derived
  /browse_collections:
    post:
      tags:
      - Browse
      summary: Get paginated collection contents, including size/modify date information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                coll:
                  type: string
                  description: Collection to get paginated contents of
                  default: '''/'''
                sort_on:
                  type: string
                  description: Column to sort on ('name', 'modified' or size)
                  default: '''name'''
                sort_order:
                  type: string
                  description: Column sort order ('asc' or 'desc')
                  default: '''asc'''
                offset:
                  type: integer
                  description: Offset to start browsing from
                  default: '0'
                limit:
                  type: integer
                  description: Limit number of results
                  default: '10'
                space:
                  type: string
                  description: Space the collection is in
                  default: pathutil.Space.OTHER.value
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_info:
                    type:
                    - string
                    - 'null'
                  data: {}
        '400':
          $ref: '#/components/responses/status_400'
        '500':
          $ref: '#/components/responses/status_500'
      operationId: postBrowseCollections
      x-operation-id-source: derived
  /search:
    post:
      tags:
      - Browse
      summary: Get paginated search results, including size/modify date/location information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - search_string
              properties:
                search_string:
                  type: string
                  description: String used to search
                  default: null
                search_type:
                  type: string
                  description: Search type ('filename', 'folder', 'metadata', 'status')
                  default: '''filename'''
                sort_on:
                  type: string
                  description: Column to sort on ('name', 'modified' or size)
                  default: '''name'''
                sort_order:
                  type: string
                  description: Column sort order ('asc' or 'desc')
                  default: '''asc'''
                offset:
                  type: integer
                  description: Offset to start browsing from
                  default: '0'
                limit:
                  type: integer
                  description: Limit number of results
                  default: '10'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_info:
                    type:
                    - string
                    - 'null'
                  data: {}
        '400':
          $ref: '#/components/responses/status_400'
        '500':
          $ref: '#/components/responses/status_500'
      operationId: postSearch
      x-operation-id-source: derived
  /load_text_obj:
    post:
      tags:
      - Browse
      summary: Retrieve a text file (as a string) in either the research, deposit, or vault…
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_path:
                  type: string
                  description: Full file path of file to load
                  default: '''/'''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_info:
                    type:
                    - string
                    - 'null'
                  data: {}
        '400':
          $ref: '#/components/responses/status_400'
        '500':
          $ref: '#/components/responses/status_500'
      operationId: postLoadTextObj
      x-operation-id-source: derived
components:
  responses:
    status_400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/result_error'
    status_500:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/result_error'
  schemas:
    result_error:
      type: object
      properties:
        status:
          type: string
          description: Holds an error ID
        status_info:
          type: string
          description: Holds a human-readable error description
        data:
          description: empty
          type:
          - object
          - 'null'
  securitySchemes:
    cookieAuth:
      in: cookie
      type: apiKey
      name: yoda_session
    basicAuth:
      type: http
      scheme: basic
